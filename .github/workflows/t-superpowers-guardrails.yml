name: t-superpowers guardrails

'on':
  pull_request:
  push:
    branches:
      - t-dev
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Stage 1 namespace check
        run: bash tools/t-stage1-check.sh

      - name: Stage 2 live surface guardrails
        shell: bash
        run: |
          set -euo pipefail

          live_paths=(
            skills
            hooks
            .claude-plugin
            .cursor-plugin
            .codex-plugin
            README.md
            docsDev/getting-started.md
          )

          check_no_matches() {
            local pattern="$1"
            local message="$2"
            set +e
            rg -n "$pattern" "${live_paths[@]}"
            local rg_status=$?
            set -e
            if [ "$rg_status" -eq 0 ]; then
              echo "$message"
              exit 1
            fi
            if [ "$rg_status" -ne 1 ]; then
              echo "FAIL: rg search failed for pattern: $pattern"
              exit "$rg_status"
            fi
          }

          check_no_matches 'docs/superpowers/(specs|plans)' \
            'FAIL: live surfaces must not instruct new runtime artifacts under docs/superpowers/specs or docs/superpowers/plans'

          check_no_matches '(^|[^t-])superpowers:(brainstorming|dispatching-parallel-agents|executing-plans|finishing-a-development-branch|receiving-code-review|requesting-code-review|subagent-driven-development|systematic-debugging|test-driven-development|using-git-worktrees|using-superpowers|verification-before-completion|writing-plans|writing-skills|archive)' \
            'FAIL: live surfaces must use t-superpowers:t-* runtime references'
